<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guestbook — The Corpus</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .guestbook { min-height: 100vh; display: grid; place-items: center; padding: 2rem 0; }
    .guest-card { width: min(760px, calc(100vw - 2rem)); border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: clamp(1.4rem, 5vw, 3rem); box-shadow: var(--shadow); }
    .guest-card h1 { font-size: clamp(3rem, 10vw, 6rem); margin-bottom: 1rem; }
    .guest-card p { color: var(--muted); font-size: 1.05rem; }
    .guest-actions { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1.5rem; }
  </style>
</head>
<body data-theme="dark">
  <div class="page-frame" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
  <main class="guestbook">
    <section class="guest-card">
      <p class="eyebrow">Guestbook</p>
      <h1>Leave a response</h1>
      <p>This redesigned page keeps the guestbook intentionally simple. Connect this button to your existing comments system, Formspree, Google Forms, Supabase, Firebase, or any backend you prefer.</p>
      <div class="guest-actions">
        <a class="primary-btn" href="mailto:dburande0124@gmail.com?subject=The%20Corpus%20Guestbook%20Response">Email a response</a>
        <a class="secondary-btn" href="index.html">Return to The Corpus</a>
      </div>
    </section>
  </main>
</body>
</html>
