<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader's Ink — Anthology Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

* {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

:root {
  --bg: #09090b;
  --bg-deep: #050506;
  --bg-card: #141417;
  --paper: #17171b;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(201, 169, 110, 0.28);
  --border-glow: rgba(201, 169, 110, 0.22);
  --ink: #f4f1e9;
  --ink-muted: #b4afa3;
  --ink-dark: #77716a;
  --gold: #c9a96e;
  --gold-glow: #b39258;
  --teal: #2f5f62;
  --radius: 16px;
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body[data-theme="light"] {
  --bg: #fbf2df;
  --bg-deep: #f3e7d0;
  --bg-card: rgba(255, 250, 240, 0.92);
  --paper: #fff8ea;
  --border: rgba(72, 55, 31, 0.13);
  --border-strong: rgba(156, 122, 60, 0.28);
  --border-glow: rgba(156, 122, 60, 0.18);
  --ink: #1e1a16;
  --ink-muted: #5f5448;
  --ink-dark: #837565;
  --gold: #9c7635;
  --gold-glow: #7a5e2d;
  --teal: #2f6f67;
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--bg), var(--bg-deep));
  color: var(--ink);
  font-family: 'DM Sans', system-ui, sans-serif;
  transition: background-color 0.5s ease, color 0.35s ease;
}

/* Navbar */
.navbar {
  position: sticky;
  top: 0;
  background: rgba(9, 9, 11, 0.76);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  padding: 0.85rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
body[data-theme="light"] .navbar {
  background: rgba(251, 242, 223, 0.84);
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--ink);
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 500;
  transition: var(--transition);
}
.back-btn:hover { color: var(--gold); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.theme-btn {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--border);
  color: var(--ink);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}
body[data-theme="light"] .theme-btn {
  background: rgba(255, 255, 255, 0.54);
}
.theme-btn:hover {
  background: var(--gold);
  color: #09090b;
  border-color: var(--gold);
}

/* Sign-in button (same as main page) */
.sign-in-btn {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 0.45rem 0.85rem;
  min-height: 36px;
  border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: var(--transition);
  white-space: nowrap;
}
body[data-theme="light"] .sign-in-btn {
  background: rgba(255, 255, 255, 0.54);
}
.sign-in-btn:hover {
  background: var(--gold);
  color: #09090b;
  border-color: var(--gold);
}
.sign-in-avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gold);
  color: #09090b;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700;
}
.sign-in-btn.signed-in { border-color: var(--border-glow); }
.sign-in-btn.signed-in:hover {
  background: rgba(231,76,60,0.15);
  color: #e74c3c;
  border-color: #e74c3c;
}

/* Main Container */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

/* Hero */
.page-hero {
  text-align: center;
  margin-bottom: 3rem;
}
.page-hero h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(2.25rem, 6vw, 3.2rem);
  font-weight: 400;
  margin-bottom: 0.5rem;
  color: var(--ink);
}
.page-hero p {
  color: var(--ink-muted);
  font-size: 1.05rem;
  font-style: italic;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 2.5rem 0;
}
.divider span {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--ink-dark);
  white-space: nowrap;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Comment Form */
.comment-form {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  margin-bottom: 2.5rem;
  box-shadow: 0 12px 32px rgba(0,0,0,0.08);
}

.form-group {
  margin-bottom: 1.25rem;
}
.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-dark);
  margin-bottom: 0.5rem;
}
.form-select, .form-textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(0,0,0,0.04);
  color: var(--ink);
  font-family: inherit;
  font-size: 0.95rem;
  transition: var(--transition);
  -webkit-user-select: text;
  -moz-user-select: text;
  user-select: text;
}
body[data-theme="dark"] .form-select,
body[data-theme="dark"] .form-textarea {
  background: rgba(0,0,0,0.2);
}
.form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--border-glow);
}
.form-textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.6;
}
.form-select {
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2377716a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 1rem center;
  padding-right: 2.5rem;
}

.submit-btn {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--gold);
  color: #09090b;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.submit-btn:hover {
  background: var(--gold-glow);
  box-shadow: 0 4px 16px rgba(201, 169, 110, 0.28);
}

.sign-in-notice {
  text-align: center;
  padding: 1.5rem;
  color: var(--ink-muted);
  font-size: 0.88rem;
  border: 1px dashed var(--border);
  border-radius: 12px;
  margin-bottom: 1.25rem;
}
.sign-in-notice a {
  color: var(--gold);
  cursor: pointer;
  text-decoration: underline;
}

/* Comments List */
.comments-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.comment-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.35rem 1.5rem;
  transition: var(--transition);
}
.comment-card:hover {
  border-color: var(--ink-dark);
}
.comment-poem-tag {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 0.6rem;
}
.comment-text {
  font-size: 0.95rem;
  line-height: 1.65;
  color: var(--ink);
  margin-bottom: 0.85rem;
}
.comment-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  color: var(--ink-dark);
}
.comment-author {
  font-weight: 600;
  color: var(--ink-muted);
}

.no-comments {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ink-dark);
  font-size: 0.92rem;
  font-style: italic;
}

/* Toast */
.toast-box {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--bg);
  padding: 0.75rem 1.5rem;
  border-radius: 30px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 3000;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
  pointer-events: none;
}
.toast-box.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Sign-in Modal */
.sign-in-modal {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 6, 0.8);
  backdrop-filter: blur(8px);
  z-index: 2500;
  display: flex;
  align-items: center;
  justify-content: center;
  visibility: hidden;
  opacity: 0;
  transition: var(--transition);
}
body[data-theme="light"] .sign-in-modal { background: rgba(251,242,223,0.8); }
.sign-in-modal.active { visibility: visible; opacity: 1; }
.sign-in-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 2.5rem 2rem;
  max-width: 380px;
  width: 90%;
  text-align: center;
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
}
.sign-in-close {
  position: absolute; top: 1rem; right: 1rem;
  background: none; border: none; color: var(--ink-dark);
  cursor: pointer; font-size: 1.3rem; padding: 4px 8px;
  border-radius: 50%; transition: var(--transition);
}
.sign-in-close:hover { color: var(--ink); background: rgba(128,128,128,0.1); }
.sign-in-card h3 {
  font-family: 'DM Sans', sans-serif;
  font-size: 1.2rem; font-weight: 600; margin-bottom: 0.35rem;
}
.sign-in-card p { font-size: 0.88rem; color: var(--ink-muted); margin-bottom: 1.5rem; }
.sign-in-input {
  width: 100%; padding: 0.75rem 1rem;
  border: 1px solid var(--border); border-radius: 10px;
  background: rgba(0,0,0,0.04); color: var(--ink);
  font-family: inherit; font-size: 0.95rem;
  margin-bottom: 1.25rem; transition: var(--transition);
  -webkit-user-select: text; -moz-user-select: text; user-select: text;
}
.sign-in-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--border-glow); }
body[data-theme="dark"] .sign-in-input { background: rgba(0,0,0,0.2); }
.sign-in-submit {
  width: 100%; padding: 0.75rem 1rem;
  background: var(--gold); color: #09090b; border: none;
  border-radius: 10px; font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: var(--transition);
}
.sign-in-submit:hover { background: var(--gold-glow); }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 1.5rem 1rem 3rem; }
  .comment-form { padding: 1.25rem; }
  .page-hero { margin-bottom: 2rem; }
  .sign-in-btn { padding: 0 0.5rem; font-size: 0; }
  .sign-in-btn .sign-in-text { display: none; }
}
</style>
</head>
<body data-theme="dark">

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Anthology Hub
  </a>
  <div class="nav-right">
    <button class="sign-in-btn" id="signInBtn" aria-label="Sign in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span class="sign-in-text">Sign In</span>
    </button>
    <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<!-- Sign-in Modal -->
<div class="sign-in-modal" id="signInModal">
  <div class="sign-in-card">
    <button class="sign-in-close" onclick="closeSignInModal()">&times;</button>
    <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="margin:0 auto 1.25rem;display:block;">
      <path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" fill="#EA4335"/>
      <path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" fill="#4285F4"/>
      <path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" fill="#FBBC05"/>
      <path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853"/>
    </svg>
    <h3>Sign in</h3>
    <p>to continue to Anthology Hub</p>
    <input type="text" class="sign-in-input" id="signInNameInput" placeholder="Enter your display name" maxlength="30">
    <button class="sign-in-submit" onclick="completeSignIn()">Continue</button>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <div class="page-hero">
    <h1>Reader's Ink</h1>
    <p>Leave your mark on the margins</p>
  </div>

  <!-- Comment Form -->
  <div class="comment-form" id="commentForm">
    <div class="sign-in-notice" id="signInNotice" style="display:none;">
      Please <a onclick="openSignInModal()">sign in</a> to share your reflections.
    </div>

    <div class="form-group">
      <label class="form-label">Select a Work</label>
      <select class="form-select" id="poemSelect">
        <option value="">Choose a poem...</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Your Reflection</label>
      <textarea class="form-textarea" id="commentText" placeholder="Share your thoughts, interpretations, or feelings about this poem..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitComment()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Post Reflection
    </button>
  </div>

  <!-- Comments List -->
  <div class="divider"><span>Recent Reflections</span></div>
  <div class="comments-list" id="commentsList">
    <div class="no-comments" id="noComments">No reflections yet. Be the first to share your thoughts.</div>
  </div>
</div>

<!-- Toast -->
<div class="toast-box" id="toastBox"><span id="toastMsg"></span></div>

<script src="poems.js"></script>
<script>
var database = Array.isArray(window.database) ? window.database : [];

// --- Toast ---
function showToast(msg) {
  var t = document.getElementById('toastBox');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('visible');
  setTimeout(function(){ t.classList.remove('visible'); }, 3000);
}

// --- Theme ---
document.getElementById('themeToggle').addEventListener('click', function() {
  var body = document.body;
  var cur = body.getAttribute('data-theme');
  body.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
});

// --- Sign-In ---
function getUser() {
  return JSON.parse(localStorage.getItem('anthology_user') || 'null');
}

function updateSignInButton() {
  var user = getUser();
  var btn = document.getElementById('signInBtn');
  if (!btn) return;
  if (user) {
    btn.classList.add('signed-in');
    btn.innerHTML = '<span class="sign-in-avatar">' + user.name.charAt(0).toUpperCase() + '</span><span class="sign-in-text">' + user.name + '</span>';
    btn.onclick = handleSignOut;
  } else {
    btn.classList.remove('signed-in');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span class="sign-in-text">Sign In</span>';
    btn.onclick = openSignInModal;
  }
  updateFormState();
}

function openSignInModal() {
  var m = document.getElementById('signInModal');
  if (m) { m.classList.add('active'); setTimeout(function(){ document.getElementById('signInNameInput').focus(); }, 300); }
}

function closeSignInModal() {
  var m = document.getElementById('signInModal');
  if (m) m.classList.remove('active');
}

function completeSignIn() {
  var input = document.getElementById('signInNameInput');
  var name = input ? input.value.trim() : '';
  if (!name) { showToast('Please enter your name.'); return; }
  localStorage.setItem('anthology_user', JSON.stringify({ name: name, signedIn: true }));
  closeSignInModal();
  updateSignInButton();
  showToast('Welcome, ' + name + '!');
}

function handleSignOut() {
  var user = getUser();
  localStorage.removeItem('anthology_user');
  updateSignInButton();
  showToast('Signed out.');
}

document.getElementById('signInModal').addEventListener('click', function(e) {
  if (e.target === this) closeSignInModal();
});
document.getElementById('signInNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') completeSignIn();
});

function updateFormState() {
  var user = getUser();
  var notice = document.getElementById('signInNotice');
  var textarea = document.getElementById('commentText');
  var select = document.getElementById('poemSelect');
  var submitBtn = document.getElementById('submitBtn');
  if (user) {
    notice.style.display = 'none';
    textarea.disabled = false;
    select.disabled = false;
    submitBtn.disabled = false;
    textarea.style.opacity = '1';
    select.style.opacity = '1';
    submitBtn.style.opacity = '1';
  } else {
    notice.style.display = 'block';
    textarea.disabled = true;
    select.disabled = true;
    submitBtn.disabled = true;
    textarea.style.opacity = '0.5';
    select.style.opacity = '0.5';
    submitBtn.style.opacity = '0.5';
  }
}

// --- Poem Selector ---
function populatePoemSelect() {
  var sel = document.getElementById('poemSelect');
  if (!sel || !database.length) return;
  database.forEach(function(item) {
    var opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.title;
    sel.appendChild(opt);
  });
}

// --- Comments ---
function getComments() {
  return JSON.parse(localStorage.getItem('anthology_comments') || '[]');
}

function saveComments(comments) {
  localStorage.setItem('anthology_comments', JSON.stringify(comments));
}

function submitComment() {
  var user = getUser();
  if (!user) {
    showToast('Please sign in to comment.');
    openSignInModal();
    return;
  }
  var poemId = document.getElementById('poemSelect').value;
  var poemTitle = document.getElementById('poemSelect').options[document.getElementById('poemSelect').selectedIndex].text;
  var text = document.getElementById('commentText').value.trim();

  if (!poemId) { showToast('Please select a poem.'); return; }
  if (!text) { showToast('Please write your reflection.'); return; }

  var comments = getComments();
  comments.unshift({
    poemId: poemId,
    poemTitle: poemTitle,
    text: text,
    author: user.name,
    date: new Date().toISOString()
  });
  saveComments(comments);

  document.getElementById('poemSelect').value = '';
  document.getElementById('commentText').value = '';
  renderComments();
  showToast('Reflection posted!');
}

function timeAgo(dateStr) {
  var now = new Date();
  var d = new Date(dateStr);
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString();
}

function renderComments() {
  var list = document.getElementById('commentsList');
  var noComments = document.getElementById('noComments');
  var comments = getComments();

  if (!comments.length) {
    list.innerHTML = '';
    list.appendChild(noComments);
    noComments.style.display = 'block';
    return;
  }

  noComments.style.display = 'none';
  list.innerHTML = comments.map(function(c) {
    return '<div class="comment-card">' +
      '<div class="comment-poem-tag">On "' + c.poemTitle + '"</div>' +
      '<div class="comment-text">' + c.text.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
      '<div class="comment-footer">' +
        '<span class="comment-author">' + c.author.replace(/</g, '&lt;') + '</span>' +
        '<span>' + timeAgo(c.date) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// --- Init ---
document.addEventListener('DOMContentLoaded', function() {
  populatePoemSelect();
  updateSignInButton();
  renderComments();
});
</script>
</body>
</html>
